name: Verify AgentMesh-CreatorCut

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: creatorcut-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    name: ${{ matrix.os }} / Node 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Enable pinned pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@10.30.3 --activate

      - name: Install
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Verify packages and public contracts
        if: runner.os != 'Windows'
        shell: bash
        run: pnpm verify

      - name: Verify Darwin arm64 secure-swap prototype
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.92.0 --profile minimal --no-self-update
          native_root="$(mktemp -d "$RUNNER_TEMP/creatorcut-native-XXXXXX")"
          CLANG_PATH="$(xcrun --find clang)" \
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" \
          RUSTC_PATH="$(rustup which --toolchain 1.92.0 rustc)" \
          NODE_PATH="$(command -v node)" \
            scripts/verify-secure-swap-prototype.sh "$native_root"

      - name: Verify Windows packages
        if: runner.os == 'Windows'
        shell: bash
        run: pnpm verify:packages

      - name: Verify Windows release installer contract
        if: runner.os == 'Windows'
        shell: bash
        run: node --test tests/public-contract/release-installer.test.mjs

      - name: Validate shell installer
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n scripts/install.sh

      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $null = [scriptblock]::Create(
            [IO.File]::ReadAllText(
              (Resolve-Path "scripts/install.ps1"),
              [Text.Encoding]::UTF8
            )
          )

      - name: Confirm CLI platform credential contract
        shell: bash
        run: |
          node apps/cli/dist/src/main.js version > version.json 2> version.stderr
          node apps/cli/dist/src/main.js --version > version-flag.json 2> version-flag.stderr
          node -e "require('node:fs').writeFileSync('warning-preload.cjs', 'setImmediate(() => process.emitWarning(\"creatorcut-warning-probe\", { type: \"ExperimentalWarning\" }));\\n')"
          node -e "require('node:fs').writeFileSync('sqlite-warning-preload.cjs', 'setImmediate(() => process.emitWarning(\"SQLite is an experimental feature and might change at any time\", { type: \"ExperimentalWarning\" }));\\n')"
          node --require ./warning-preload.cjs apps/cli/dist/src/main.js version > warning-version.json 2> warning-version.stderr
          node --require ./sqlite-warning-preload.cjs apps/cli/dist/src/main.js version > sqlite-warning-version.json 2> sqlite-warning-version.stderr
          test ! -s version.stderr
          test ! -s version-flag.stderr
          test ! -s sqlite-warning-version.stderr
          test "$(grep -c creatorcut-warning-probe warning-version.stderr)" -eq 1
          node -e "const positional=require('./version.json'); const flag=require('./version-flag.json'); const warning=require('./warning-version.json'); const sqliteWarning=require('./sqlite-warning-version.json'); const expected=require('./apps/cli/package.json').version; if(!positional.ok||positional.data.version!==expected||JSON.stringify(flag)!==JSON.stringify(positional)||JSON.stringify(warning)!==JSON.stringify(positional)||JSON.stringify(sqliteWarning)!==JSON.stringify(positional))process.exit(1)"
