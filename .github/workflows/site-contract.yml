name: Verify AgentMesh-CreatorCut website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/validate-site.mjs"
      - "tests/public-contract/site-contract.test.mjs"
      - ".github/workflows/site-contract.yml"
  pull_request:
    paths:
      - "site/**"
      - "scripts/validate-site.mjs"
      - "tests/public-contract/site-contract.test.mjs"
      - ".github/workflows/site-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - run: node scripts/validate-site.mjs site
